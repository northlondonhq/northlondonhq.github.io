
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>North London | Login</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>
<body class="login-page">

<div class="login-box">
    <h1>NORTH LONDON</h1>
    

    <div id="loginPanel">
        <h2>Login</h2>

        <label>Username or Staff Email</label>
        <input id="loginIdentity" type="text" placeholder="Username or email" required>

        <label>Password</label>
        <input id="password" type="password" required>

        <button id="loginButton">Login</button>

        <p>Need a public account?</p>
        <button id="registerButton">Create Public Account</button>
    </div>

    <p id="message"></p>
</div>

<script>
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

button.onclick = async () => {
    const identity = document.getElementById("loginIdentity").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "";

    if (!identity || !password) {
        message.textContent = "Please enter your username/email and password.";
        return;
    }

    button.disabled = true;
    button.textContent = "Logging in...";

    // Public usernames use the same hidden identifier as registration.
    // Staff continue using their normal email addresses.
    const loginEmail = identity.includes("@")
        ? identity
        : identity.toLowerCase() + "@northlondon.invalid";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: loginEmail,
        password: password
    });

    if (error) {
        message.textContent = "Login failed. Check your username/email and password.";
        button.disabled = false;
        button.textContent = "Login";
        return;
    }

    const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", data.user.id)
        .single();

    if (profileError || !profile) {
        await supabaseClient.auth.signOut();
        message.textContent = "Your account profile could not be found. Please contact an administrator.";
        button.disabled = false;
        button.textContent = "Login";
        return;
    }

    if (profile.role === "public") {
        window.location.replace("training.html");
    } else {
        window.location.replace("index.html");
    }
};

document.getElementById("registerButton").onclick = () => {
    window.location.href = "register.html";
};
</script>

</body>
</html>
