
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North London | Training Records</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>
<body>
    <main class="container">
        <h1>North London</h1>
        <h2>Training Records</h2>
        <p>View your personal training history.</p>

        <section id="accessMessage">
            Checking account...
        </section>

        <section id="historyPanel" hidden>
            <h3>My Training History</h3>
            <div id="historyList">Loading your records...</div>
        </section>

        <section id="trainingPanel" hidden>
            <h3>Log New Training</h3>
            <form id="trainingForm">
                <label for="trainee">Trainee Username</label>
                <input id="trainee" required>

                <label for="department">Department</label>
                <select id="department" required>
                    <option value="">Select department</option>
                    <option>Metropolitan Police Service</option>
                    <option>Roads Policing Unit</option>
                    <option>Armed Response Unit</option>
                    <option>London Ambulance Service</option>
                    <option>London Fire Brigade</option>
                </select>

                <label for="trainingType">Training Type</label>
                <input id="trainingType" required>

                <label for="trainerName">Trainer Name</label>
                <input id="trainerName" readonly>

                <label for="result">Result</label>
                <select id="result" required>
                    <option value="">Select result</option>
                    <option value="Passed">Passed</option>
                    <option value="Failed">Failed</option>
                </select>

                <label for="notes">Training Notes</label>
                <textarea id="notes" rows="4"></textarea>

                <button type="submit">Submit Training Record</button>
            </form>
            <p id="trainingMessage"></p>
        </section>

        <p><a href="index.html">Back to Dashboard</a></p>
    </main>

    <script src="js/training.js"></script>
</body>
</html>
