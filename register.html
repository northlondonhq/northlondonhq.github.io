
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>North London | Public Registration</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>
<body class="login-page">

<div class="login-box">
    <h1>NORTH LONDON</h1>
    <p class="subtitle">PUBLIC MEMBER REGISTRATION</p>

    <label>Username</label>
    <input id="username" type="text" placeholder="Choose a username" maxlength="20">

    <label>Password</label>
    <input id="password" type="password" placeholder="At least 10 characters">

    <button id="registerButton">Create Account</button>

    <p id="message"></p>
    <a href="login.html">Already registered? Login</a>
</div>

<script>
const message = document.getElementById("message");

document.getElementById("registerButton").onclick = async () => {
    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const button = document.getElementById("registerButton");

    message.textContent = "";

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        message.textContent = "Username must be 3-20 letters, numbers or underscores.";
        return;
    }

    if (password.length < 10) {
        message.textContent = "Password must be at least 10 characters.";
        return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    // Internal login identifier. Public users never need to enter this.
    const hiddenEmail = username + "@northlondon.invalid";

    const { data, error } = await supabaseClient.auth.signUp({
        email: hiddenEmail,
        password: password,
        options: {
            data: {
                username: username
            }
        }
    });

    if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Create Account";
        return;
    }

    if (data.session) {
        message.textContent = "Account created! Redirecting...";
        window.location.replace("training.html");
        return;
    }

    message.textContent = "Account created, but no login session was returned. Please contact an administrator.";
    button.disabled = false;
    button.textContent = "Create Account";
};
</script>

</body>
</html>
